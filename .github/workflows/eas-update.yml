name: EAS Update

on:
  push:
    branches:
      - main
      - claude/redesign-app-ui-HtCu7

jobs:
  update:
    name: OTA Update → preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish EAS Update
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Send update to preview branch
        run: |
          eas update --branch preview --platform android \
            --message "Auto: ${{ github.event.head_commit.message }}" \
            --non-interactive
        env:
          CI: "1"
